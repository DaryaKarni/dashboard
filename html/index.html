<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../styles/main.css" rel="stylesheet"></link>
  <title>Document</title>
</head>
<body>
  <main>
    <div class="collapsible-sidebar">
      <button id="burger">☰</button>
      <div class="selector">
        <h3>Period</h3>
        <select id="month-select">
          <option value="0">January</option>
          <option value="1">February</option>
          <option value="2">March</option>
          <option value="3" selected>April</option>
          <option value="4">May</option>
          <option value="5">June</option>
          <option value="6">July</option>
          <option value="7">August</option>
          <option value="8">September</option>
          <option value="9">October</option>
          <option value="10">November</option>
          <option value="11">December</option>
        </select>
        <select id="year-select">
          <option value="2025">2025</option>
          <option value="2026" selected>2026</option>
          <option value="2027">2027</option>
        </select>
      </div>
      <nav class="nav">
        <a href="#" id="nav-projects" data-type="projects">Projects</a>
        <a href="#" id="nav-employees" data-type="employees" selected>Employees</a>
      </nav>
    </div>
    <div id="button-back" class="burger-back hidden">→</div>
    <div class="main-content">
       <!--делаю это -->
        <div class="header">
          <h1 class="table-title">Projects</h1>
          <div class="buttons">
            <button id="button-add-project" class="green-button">+ Add Project</button>
            <button id="button-seed-data" class="green-button">Seed Data</button>
            <button id="button-add-employee" class="green-button hidden">+ Add Employee</button>
          </div>
        </div>
        <table id="table">
        </table>
        <div class="total">
          <strong>Total Estimated Income:</strong>
          <span>$-16240.83</span>
          <span>(Bench payments: $8700.00)</span>
        </div>
      </div>
      <div class="main-employess"></div>
    </div>

    <div class="side-in-project"></div>
    <div class="module-employees"></div>

    <div class="side-in-employees"></div>
    <div class="module-employees"></div>

  </main>
  <footer>

  </footer>
</body>
<script type="module" src="../jscode/sidebar.js">
</script>
</html>
